; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
extra_configs =
	      secrets.ini
	      local.ini

[node32s]
platform = espressif32
framework = arduino
board = esp32dev
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
check_tool = cppcheck
check_skip_packages = yes
monitor_filters = esp32_exception_decoder
build_type = release
lib_deps =
	chl33/og3@^0.6.3
	chl33/og3x-oled@^0.6.1
	chl33/og3x-shtc3@^0.6.0
	adafruit/Adafruit BusIO
	adafruit/Adafruit SHTC3 Library
	adafruit/Adafruit Unified Sensor
	bakercp/CRC32
	bblanchon/ArduinoJson@^7.0.0
	elims/PsychicMqttClient@^0.2.4
	hoeken/PsychicHttp@^2.1.1
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.2
	SPI
	Wire
	WiFi

build_flags =
	${local.build_flags}
	'-Wall'
	'-D OTA_PASSWORD="${secrets.otaPassword}"'
lib_ldf_mode = chain
lib_compat_mode = strict

[env:usb_node32s]
extends = node32s
upload_protocol = esptool
upload_port = /dev/ttyUSB0

[esp32s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
check_tool = cppcheck
check_skip_packages = yes
monitor_filters = esp32_exception_decoder
build_type = release
lib_deps =
	${node32s.lib_deps}
build_flags =
	${node32s.build_flags}
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
lib_ldf_mode = chain
lib_compat_mode = strict

[env:usb_s3]
extends = esp32s3
upload_protocol = esptool
upload_port = /dev/ttyACM0


[env:wifi_node32s]
extends = node32s
upload_protocol = espota
upload_port = ${local.uploadPort}
upload_flags =
        ${local.wifi_upload_flags}
	--auth='${secrets.otaPassword}'

[env:native]
platform = native
build_flags = -std=c++11 -D NATIVE
lib_ldf_mode = chain
lib_compat_mode = strict
lib_deps =
	chl33/og3@^0.6.0
	bblanchon/ArduinoJson@^7.0.0
	fabiobatsilva/ArduinoFake@^0.4.0
